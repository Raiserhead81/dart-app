server {
    listen 80;
    listen [::]:80;
    server_name dart.gemivo.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dart.gemivo.de;
    ssl_certificate /etc/letsencrypt/live/dart.gemivo.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dart.gemivo.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/dart-app;
    index index.html;
    client_max_body_size 8m;

    include /etc/nginx/snippets/gemivo-app-headers.conf;

    # Version + Service Worker: niemals cachen (PWA-Auto-Update)
    location = /VERSION {
        include /etc/nginx/snippets/gemivo-app-headers.conf;
        add_header Cache-Control "max-age=0";
        add_header X-Content-Type-Options "nosniff" always;
        default_type text/plain;
    }
    location = /sw.js {
        include /etc/nginx/snippets/gemivo-app-headers.conf;
        add_header Cache-Control "max-age=0";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Caller-Clips (statisch, liegt AUSSERHALB des rsync-Wegs)
    location /caller/ {
        alias /var/www/dart-app-caller/;
        include /etc/nginx/snippets/gemivo-app-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # APK-Download: exakt das bewaehrte Tennis-Muster (Kays Vorgabe 22.10., "es ging sonst auch")
    location = /download/dart-app.apk {
        alias /var/www/apk-host/dart.gemivo.de/download/dart-app.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment; filename=dart-app.apk";
    }

    # API -> Node-Service (Port 3121)
    location /api/ {
        proxy_pass http://127.0.0.1:3121;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        include /etc/nginx/snippets/gemivo-app-headers.conf;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~ /\.(git|env|ht) { deny all; return 404; }
    location ^~ /.well-known/ { allow all; }

    location / {
        include /etc/nginx/snippets/gemivo-app-headers.conf;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ =404;
    }
}
