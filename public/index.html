<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DartPro — Scoreboard &amp; Fortschritt</title>
<meta name="description" content="Dart-Scoreboard mit Wochen-Statistik, Stärken/Schwächen-Analyse und Trainingsdrills.">
<meta name="theme-color" content="#0d3320">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DartPro">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<svg style="display:none" aria-hidden="true"><defs>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.5 19c.6-3 2.8-4.6 5.5-4.6S13.9 16 14.5 19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="17" cy="9" r="2.4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M15.8 13.8c2.4.2 4 1.6 4.7 4.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12 8.5A3.5 3.5 0 1 0 12 15.5 3.5 3.5 0 0 0 12 8.5zm8-.6-1.8-.5a6.6 6.6 0 0 0-.8-1.9l.9-1.6-1.5-1.5-1.6.9a6.6 6.6 0 0 0-1.9-.8L12.9 1h-2.1l-.5 1.8a6.6 6.6 0 0 0-1.9.8l-1.6-.9L5.3 4.2l.9 1.6a6.6 6.6 0 0 0-.8 1.9L3.6 8.2v2.1l1.8.5a6.6 6.6 0 0 0 .8 1.9l-.9 1.6 1.5 1.5 1.6-.9a6.6 6.6 0 0 0 1.9.8l.5 1.8h2.1l.5-1.8a6.6 6.6 0 0 0 1.9-.8l1.6.9 1.5-1.5-.9-1.6a6.6 6.6 0 0 0 .8-1.9l1.8-.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M8 5 4 9l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h9a6 6 0 1 1 0 12h-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 13 4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11m0 0 4.5-4.5M12 15l-4.5-4.5M4 19h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4m0 0 4.5 4.5M12 4 7.5 8.5M4 19h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-fire" viewBox="0 0 24 24"><path d="M12 3c1 3-3 4.5-3 8a3 3 0 0 0 6 .3C16.5 13 18 14.7 18 17a6 6 0 0 1-12 0c0-5 5-7 6-14z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0zM7 5H4.5a2.5 2.5 0 0 0 2.6 3.5M17 5h2.5a2.5 2.5 0 0 1-2.6 3.5M12 14v3m-4 4h8m-7-4h6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3 5 13h5l-1 8 8-11h-5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
</defs></svg>

<div id="app" class="app">
  <nav class="rail" id="nav">
    <a class="brand" href="#/play"><svg class="ic"><use href="#i-target"/></svg><span>DartPro</span></a>
    <a href="#/play" data-nav="play"><svg class="ic"><use href="#i-target"/></svg><span>Spielen</span></a>
    <a href="#/training" data-nav="training"><svg class="ic"><use href="#i-bolt"/></svg><span>Training</span></a>
    <a href="#/stats" data-nav="stats"><svg class="ic"><use href="#i-chart"/></svg><span>Statistik</span></a>
    <a href="#/online" data-nav="online"><svg class="ic"><use href="#i-users"/></svg><span>Netzwerk</span></a>
    <a href="#/profile" data-nav="profile"><svg class="ic"><use href="#i-gear"/></svg><span>Profil</span></a>
  </nav>
  <main id="view" class="view" aria-live="polite"></main>
</div>

<script type="module" src="/js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
</script>
</body>
</html>
